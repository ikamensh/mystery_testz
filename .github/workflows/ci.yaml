name: ci-pipeline
on: ["push"]

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Permission to commit and push changes to a branch
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run tests 2
        run: |
          pip install pytest pytest-cov
          pip install -e .
          ls -la
          pytest
          echo "running cp command"
          cp .pytest_cache/.coverage .pytest_cache/.coverage_cpu
          poetry run pytest -m "cuda and not ubfm" --ignore tests/regression --slow-last --durations=0 --durations-min=5
          cp .pytest_cache/.coverage .pytest_cache/.coverage_cuda

      - name: install git
        run: |
          ls -la
          cp blo bla
